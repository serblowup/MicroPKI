name: MicroPKI CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # позволяет запускать вручную

env:
  GO_VERSION: '1.25'
  GO111MODULE: on

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.21', '1.22', '1.23', '1.25']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: micropki/go.sum

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl

      - name: Install OpenSSL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Verify OpenSSL installation
        run: openssl version

      - name: Install dependencies
        working-directory: ./micropki
        run: |
          go mod download
          go mod tidy
          go mod verify

      - name: Run vet
        working-directory: ./micropki
        run: go vet ./...

      - name: Run staticcheck (optional, если есть)
        continue-on-error: true
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./micropki/...

      - name: Run tests with coverage
        working-directory: ./micropki
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./tests/... -coverpkg=./internal/... -timeout 600s

      - name: Display coverage
        working-directory: ./micropki
        run: |
          go tool cover -func=coverage.out | grep -E "total|CheckCertificate"
          echo "=== Total coverage ==="
          go tool cover -func=coverage.out | grep total

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-go${{ matrix.go-version }}
          path: micropki/coverage.out
          retention-days: 7

  test-short:
    name: Quick tests (short mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: micropki/go.sum

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Run short tests
        working-directory: ./micropki
        run: make test-short

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: micropki/go.sum

      - name: Build
        working-directory: ./micropki
        run: make build

      - name: Upload binary (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: micropki-${{ runner.os }}
          path: micropki/bin/micropki
          retention-days: 7

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: micropki-${{ runner.os }}
          path: micropki/bin/micropki.exe
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: micropki/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./micropki
          args: --timeout=5m --skip-dirs=scripts --skip-dirs=tests

  coverage-badge:
    name: Generate coverage badge
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests with coverage
        working-directory: ./micropki
        run: |
          go test -coverprofile=coverage.out ./tests/... -coverpkg=./internal/... -timeout 300s

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-go@v2
        with:
          filename: micropki/coverage.out
          label: 'Coverage'
          output: coverage-badge.svg

      - name: Upload badge to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.svg
          retention-days: 7